<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e71324">
<title>Song ID Fold</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
  Song ID prop for the Galaxy Z Fold 8 inner screen (2448 × 1848 px, landscape).
  Built from Figma "Shazam App - Open Screen" (jO4VrQnb9mAVd7SkmDKv9Y, 112:6024).
  Every size is in Figma px × --u, so the layout matches the frame at any screen size.
  Landscape: two halves side by side. Portrait / narrow: listen area on top, player below.
*/
:root {
  --u: 1px;
  --red: #e71324;      /* whole background */
  --ring: #861a21;     /* concentric rings */
  --soft: rgba(255, 255, 255, .74);   /* secondary text and icons on red */
  --nav: #090909;
  --accent: #e92626;   /* play button, active tab */
  --ink: #f2f2f2;
  --mute: #8e8e8e;
  --lyric: #f6eaea;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--red); overflow: hidden; }
body {
  font-family: Inter, "Helvetica Neue", Roboto, Arial, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; display: grid; place-items: center; }
svg { display: block; }

.app { position: fixed; inset: 0; display: flex; }
.app.stacked { flex-direction: column; }

/* ---------- status bar (spans both halves, as in Figma) ----------
   Hidden by default so the device's own status bar shows; the player keeps its 44px gap for it. ?status=1 shows this mock one. */
.status {
  position: absolute; z-index: 5; top: 0; left: 0; right: 0;
  height: calc(44 * var(--u)); padding: 0 calc(22 * var(--u)) 0 calc(20 * var(--u));
  display: flex; align-items: center; justify-content: space-between; pointer-events: none;
}
.status .time { font-size: calc(14 * var(--u)); font-weight: 600; letter-spacing: .01em; }
.status .icons { display: flex; align-items: center; gap: calc(5 * var(--u)); }
body:not(.show-status) .status { display: none; }

/* ---------- listen half ---------- */
.listen { position: relative; flex: 1 1 50%; overflow: hidden; cursor: pointer; }
.stacked .listen { flex: 0 0 40%; }
/* the rings canvas spans the whole screen, so the rings run on behind the player half */
#rings { position: absolute; inset: 0; width: 100%; height: 100%; }
.logo {
  position: absolute; left: 50%; top: 50%;
  width: calc(179 * var(--u)); height: calc(179 * var(--u));
  margin: calc(-89.5 * var(--u)) 0 0 calc(-89.5 * var(--u));
  border-radius: 50%; will-change: transform;
}
.logo svg { width: 100%; height: 100%; filter: drop-shadow(0 0 calc(6 * var(--u)) rgba(90, 0, 0, .25)); }

/* ---------- player half ---------- */
.player { position: relative; flex: 1 1 50%; overflow: hidden; }
.stacked .player { flex: 1 1 60%; }
.stage {
  position: relative; height: 100%; width: calc(523 * var(--u)); margin: 0 auto;
  display: flex; flex-direction: column; align-items: center;
}
.sb-space { flex: 0 0 max(calc(44 * var(--u)), env(safe-area-inset-top, 0px)); }
.stacked .sb-space { flex-basis: calc(10 * var(--u)); }

.hdr {
  flex: 0 0 auto; width: 100%; height: calc(40 * var(--u)); margin-top: calc(6 * var(--u));
  display: grid; grid-template-columns: calc(54 * var(--u)) 1fr calc(54 * var(--u)); align-items: center;
}
.hdr h2 { text-align: center; font-size: calc(18 * var(--u)); font-weight: 400; color: #e4e4e4; letter-spacing: .01em; }
.hdr .back svg { width: calc(22 * var(--u)); height: calc(22 * var(--u)); }
.hdr .fav svg { width: calc(24 * var(--u)); height: calc(24 * var(--u)); }
.hdr .fav path { fill: var(--soft); stroke: transparent; transition: fill .25s, stroke .25s; }
.hdr .fav.on path { fill: #fff; stroke: #fff; }

.card {
  position: relative; flex: 0 0 calc(280 * var(--u)); width: calc(437 * var(--u)); margin-top: calc(55 * var(--u));
  border-radius: calc(18 * var(--u)); overflow: hidden;
  background: linear-gradient(180deg, #ca0915 0%, #a10913 30%, #6e0b12 62%, #3a0d10 84%, #2a0d10 100%);
}
/* the lyrics card is hidden for now; a square album cover sits in its place */
.card { display: none; }
.cover {
  position: relative; flex: 0 0 calc(280 * var(--u)); width: calc(280 * var(--u)); margin-top: calc(55 * var(--u));
  border-radius: calc(18 * var(--u)); overflow: hidden;
  background: rgba(70, 0, 8, .28); box-shadow: inset 0 0 0 calc(2 * var(--u)) rgba(255, 255, 255, .22);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(12 * var(--u));
  color: rgba(255, 255, 255, .62); font-size: calc(16 * var(--u)); font-weight: 500; letter-spacing: .04em;
}
.cover svg { width: calc(64 * var(--u)); height: calc(64 * var(--u)); }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .label {
  position: absolute; top: calc(19 * var(--u)); left: 0; right: 0; text-align: center;
  font-size: calc(18 * var(--u)); line-height: calc(22 * var(--u)); font-weight: 700; letter-spacing: .02em; color: #fff;
}
.lyr-window {
  position: absolute; left: 0; right: 0; top: calc(52 * var(--u)); bottom: 0; overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 calc(12 * var(--u)), #000 72%, transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0, #000 calc(12 * var(--u)), #000 72%, transparent 100%);
}
.lyr-list { padding: calc(12 * var(--u)) calc(29 * var(--u)) 0; transition: transform .7s cubic-bezier(.22, .8, .24, 1); }
.lyr-list p {
  font-size: calc(30 * var(--u)); line-height: calc(46 * var(--u)); font-weight: 400; letter-spacing: .005em;
  color: var(--lyric); opacity: .32; transition: opacity .6s ease;
}
.lyr-list p.next { opacity: .62; }
.lyr-list p.on { opacity: 1; }
.lyr-list p.past { opacity: .22; }
.lyr-list p.break { letter-spacing: .3em; }
.snap, .snap * { transition: none !important; }

.titles { flex: 0 0 auto; margin-top: calc(50 * var(--u)); text-align: center; width: 100%; padding: 0 calc(16 * var(--u)); }
.titles h1 { font-size: calc(44 * var(--u)); line-height: calc(52 * var(--u)); font-weight: 500; letter-spacing: .005em; white-space: nowrap; }
.titles p { margin-top: calc(10 * var(--u)); font-size: calc(26 * var(--u)); line-height: calc(32 * var(--u)); color: var(--soft); }

.controls {
  flex: 0 0 auto; margin-top: auto; padding-top: calc(28 * var(--u));
  display: flex; align-items: center; gap: calc(41 * var(--u));
}
.controls .ic svg { width: calc(26 * var(--u)); height: calc(26 * var(--u)); }
.play {
  width: calc(78 * var(--u)); height: calc(78 * var(--u)); border-radius: 50%; background: #fff;
  box-shadow: 0 0 calc(47 * var(--u)) rgba(90, 0, 8, .35);
  transition: transform .15s;
}
.play:active { transform: scale(.94) !important; }
.play svg { height: calc(33 * var(--u)); width: auto; }
.play .i-play { margin-left: calc(5 * var(--u)); }
.play .i-pause, .play.playing .i-play { display: none; }
.play.playing .i-pause { display: block; }
/* the transport (shuffle, previous, play/pause, next, repeat) is hidden; "Open song" takes its place */
.controls > :not(.open) { display: none; }
.open {
  display: flex; align-items: center; gap: calc(9 * var(--u));
  height: calc(54 * var(--u)); padding: 0 calc(26 * var(--u)) 0 calc(30 * var(--u)); border-radius: calc(27 * var(--u));
  background: #fff; color: var(--red);
  font-size: calc(19 * var(--u)); font-weight: 600; letter-spacing: .01em;
  box-shadow: 0 0 calc(47 * var(--u)) rgba(90, 0, 8, .35);
}
.open:active { transform: scale(.96) !important; }
.open svg { width: calc(19 * var(--u)); height: calc(19 * var(--u)); }

.nav {
  flex: 0 0 calc(89 * var(--u)); width: calc(475 * var(--u)); margin-top: calc(41 * var(--u));
  background: var(--nav); border: 1px solid rgba(255, 255, 255, .13); border-bottom: 0;
  border-radius: calc(40 * var(--u)) calc(40 * var(--u)) 0 0;
  display: flex; justify-content: space-around; align-items: flex-start;
  padding: calc(30 * var(--u)) calc(14 * var(--u)) 0;
}
.nav svg { width: calc(30 * var(--u)); height: calc(30 * var(--u)); }
.nav .on { color: var(--accent); }
.nav button { color: var(--mute); }

/* idle / listening message on the empty player half */
.hint {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-size: calc(22 * var(--u)); color: var(--soft); letter-spacing: .01em;
  transition: opacity .4s;
}
.hint span { transition: opacity .3s; }
.found .hint, .no-hint .hint { opacity: 0; }

/* ---------- reveal choreography: title → play button → rest of the UI ---------- */
.reveal { opacity: 0; transform: translateY(calc(18 * var(--u))); transition: opacity .35s ease, transform .35s ease; }
.play.reveal { transform: scale(.35); }
.found .reveal {
  opacity: 1; transform: none;
  transition: opacity .7s ease var(--d, 0s), transform .8s cubic-bezier(.2, .9, .25, 1) var(--d, 0s);
}
.found .play.reveal { transition: opacity .45s ease var(--d), transform .7s cubic-bezier(.34, 1.7, .5, 1) var(--d); }
</style>
</head>

<div class="app" id="app">

  <div class="status">

      <svg width="25" height="12" viewBox="0 0 24.74 11.85" style="width:calc(25*var(--u));height:auto"><rect x=".5" y=".5" width="22" height="10.85" rx="2.17" fill="none" stroke="#fff" opacity=".35"/><path opacity=".4" fill="#fff" d="M23.69 3.83v4.18c.64-.35 1.05-1.18 1.05-2.09s-.41-1.74-1.05-2.09"/><rect x="2.09" y="2.09" width="18.82" height="7.67" rx="1.33" fill="#fff"/></svg>

  <section class="player" id="player">

        <button class="on" aria-label="Music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
        <button aria-label="Favorites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
        <button aria-label="Nearby"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></button>
      </nav>
    </div>
  </section>
</div>

<script>
(() => {
  const SONG = { title: "Funiculì, Funiculà", subtitle: "Let’s Go to the Top" };

  // English lyrics (the prop's own singing translation of the public-domain 1880 song).
  // [line, seconds on screen]; \n forces a line break. Starts at "…to see the sky!" and loops back round to it.
  const LYRICS = [
    ["…to see the sky!", 2.6],
    ["Let’s go up to the top,\nlet’s go…", 3.6],
    ["Let’s go, let’s go, up to the top, let’s go,", 3.4],
    ["funiculì, funiculà, funiculì, funiculà,", 3.4],
    ["up to the top, let’s go, funiculì, funiculà!", 4.2],
    ["♪ ♪ ♪", 4.0],
    ["Last night, Nannina, I climbed up high,", 3.6],
    ["you know where, you know where,", 3.0],
    ["where this ungrateful heart", 3.0],
    ["can’t hurt me anymore, not anymore!", 3.6],
    ["Where the fire burns, but if you run", 3.4],
    ["it lets you be, it lets you be!", 3.0],
    ["It won’t chase after you or wear you down", 3.6],
    ["just by looking, just by looking.", 3.6],
    ["Let’s go, let’s go, up to the top, let’s go,", 3.4],
    ["let’s go, let’s go, up to the top, let’s go,", 3.4],
    ["funiculì, funiculà, funiculì, funiculà,", 3.4],
    ["up to the top, let’s go, funiculì, funiculà!", 4.2],
    ["♪ ♪ ♪", 4.0],
    ["Come on, from the ground up to the mountain", 3.6],
    ["is only one step, only one step!", 3.0],
    ["You can see France, Procida and Spain…", 3.6],
    ["and I see you, I see you!", 3.0],
    ["Pulled by the cable, quick as a word,", 3.4],
    ["we’re climbing high, we’re climbing high…", 3.2],
    ["We go like the wind, all of a sudden,", 3.4],
    ["up, up we climb, up, up we climb…", 3.2],
  ];

  const q = new URLSearchParams(location.search);
  const LISTEN_SECONDS = Math.max(1, +q.get("listen") || 4.6);   // ?listen=6
  if (q.get("status") === "1") document.body.classList.add("show-status");
  if (q.get("hint") === "0") document.body.classList.add("no-hint");

  const $ = s => document.querySelector(s);
  const app = $("#app"), listenEl = $("#listen"), logo = $("#logo"), canvas = $("#rings");
  const ctx = canvas.getContext("2d");
  const playBtn = $("#play"), hint = $("#hint"), list = $("#lyrics");
  $("#title").textContent = SONG.title;
  $("#subtitle").textContent = SONG.subtitle;

  // ---------- layout: Figma px → screen via --u ----------
  const FADE_LEN = 260, FADE_SHIFT = 140;   // Figma px: fade width, and how far before the centre line it starts
  let U = 1, W = 0, H = 0, CX = 0, CY = 0, FADE = [0, 0, 0, 0], dpr = 1;
  function fit() {
    const vw = innerWidth, vh = innerHeight;
    const stacked = vw < vh * 0.9;
    app.classList.toggle("stacked", stacked);
    U = stacked ? Math.min(vw / 523, (vh * 0.6) / 790) : Math.min(vw / 2 / 523, vh / 849);
    document.documentElement.style.setProperty("--u", U + "px");
    // rings are centred on the listen half but drawn across the whole screen
    const r = listenEl.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = innerWidth; H = innerHeight;
    CX = r.left + r.width / 2; CY = r.top + r.height / 2;
    // the rings start fading FADE_SHIFT Figma px before the centre line (the listen half's far edge), gone FADE_LEN later
    const len = FADE_LEN * U, from = (stacked ? r.bottom : r.right) - FADE_SHIFT * U;
    FADE = stacked ? [0, from, 0, from + len] : [from, 0, from + len, 0];
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    dirty = true;
    placeLyric(false);
  }

  // ---------- lyrics ----------
  // Rendered twice so the loop can scroll past the end and snap back invisibly.
  const N = LYRICS.length;
  list.innerHTML = [...LYRICS, ...LYRICS].map(([t]) =>
    `<p${t.startsWith("♪") ? ' class="break"' : ""}>${t.replace("\n", "<br>")}</p>`).join("");
  const rows = [...list.children];
  let pos = 0, lyricTimer = 0, lyricDue = 0, lyricLeft = 0, playing = false;

  function placeLyric(animate = true) {
    if (!animate) list.classList.add("snap");
    rows.forEach((p, k) => {
      p.className = (LYRICS[k % N][0].startsWith("♪") ? "break " : "") +
        (k === pos ? "on" : k === pos + 1 ? "next" : k < pos ? "past" : "");
    });
    list.style.transform = `translateY(${-rows[pos].offsetTop + rows[0].offsetTop}px)`;
    if (!animate) { list.offsetHeight; list.classList.remove("snap"); }
  }
  function scheduleLyric(ms) {
    clearTimeout(lyricTimer);
    lyricDue = performance.now() + ms;
    lyricTimer = setTimeout(nextLyric, ms);
  }
  function nextLyric() {
    pos++;
    placeLyric(true);
    if (pos >= N) setTimeout(() => { if (pos >= N) { pos -= N; placeLyric(false); } }, 800);
    scheduleLyric(LYRICS[pos % N][1] * 1000);
  }
  function setPlaying(on) {
    playing = on;
    playBtn.classList.toggle("playing", on);
    playBtn.setAttribute("aria-label", on ? "Pause" : "Play");
    if (on) scheduleLyric(lyricLeft || LYRICS[pos % N][1] * 1000);
    else { lyricLeft = Math.max(0, lyricDue - performance.now()); clearTimeout(lyricTimer); }
  }
  function resetLyrics() {
    clearTimeout(lyricTimer); playing = false; lyricLeft = 0; pos = 0;
    playBtn.classList.remove("playing");
    placeLyric(false);
  }

  // ---------- flow: idle → listening → found ----------
  let state = "idle", tStart = 0, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function listen() {
    if (state !== "idle") return;
    state = "listening"; tStart = performance.now(); beatClock = 0; lastBeat = -1;
    hint.textContent = "Listening…";
    later(found, LISTEN_SECONDS * 1000);
  }
  function found() {
    state = "found";
    app.classList.add("found");
    // title → play button → rest of the UI; the lyrics wait on the first line until play is tapped
  }
  function reset() {
    timers.forEach(clearTimeout); timers = [];
    state = "idle";
    app.classList.remove("found");
    hint.textContent = "Tap to identify the song";
    setTimeout(resetLyrics, 350);
  }

  listenEl.addEventListener("click", () => { if (state === "idle") listen(); });
  logo.addEventListener("click", e => { if (state !== "idle") { e.stopPropagation(); reset(); } });
  $("#home").addEventListener("click", () => { if (state !== "idle") reset(); });
  playBtn.addEventListener("click", () => { if (state === "found") setPlaying(!playing); });
  // "Open song" starts the lyrics (Space still pauses and resumes them)
  $("#open").addEventListener("click", () => { if (state === "found" && !playing) setPlaying(true); });
  $("#fav").addEventListener("click", e => e.currentTarget.classList.toggle("on"));
  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === " " || k === "enter") { e.preventDefault(); state === "idle" ? listen() : state === "found" && setPlaying(!playing); }
    else if (k === "r" || k === "escape") reset();
  });

  // Full screen on the first touch on a real device (not inside an iframe/preview).
  addEventListener("pointerdown", function fs(e) {
    if (e.pointerType !== "touch" || window.self !== window.top || document.fullscreenElement) return;
    removeEventListener("pointerdown", fs);
    document.documentElement.requestFullscreen?.({ navigationUI: "hide" }).catch(() => {});
    navigator.wakeLock?.request("screen").catch(() => {});
  });
  addEventListener("contextmenu", e => e.preventDefault());

  // ---------- rings + heartbeat (canvas) ----------
  const R0 = 168, GAP = 50, LINE = 5, LOGO_R = 89.5;  // Figma px
  const BEAT = 0.86;                                      // seconds per heartbeat
  let phase = 0, scale = 1, glow = 0, beatClock = 0, lastBeat = -1, shocks = [], dirty = true, prev = 0;

  // lub-dub envelope: quick swell then decay, second smaller beat 0.22 s later
  const env = x => x <= 0 ? 0 : (x / 0.075) * Math.exp(1 - x / 0.075);
  const heart = t => env(t) + 0.62 * env(t - 0.22);

  function frame(now) {
    const dt = Math.min(0.05, (now - (prev || now)) / 1000); prev = now;
    let beat = 0;

    if (state === "listening") {
      beatClock += dt;
      const k = Math.floor(beatClock / BEAT);
      if (k !== lastBeat) { lastBeat = k; shocks.push({ age: 0 }); }
      beat = heart(beatClock - k * BEAT);
      phase += dt * (0.42 + 2.05 * beat);           // rings ride outward, surging on each beat
      scale = 1 + 0.11 * beat;
      glow += (beat - glow) * Math.min(1, dt * 18);
      dirty = true;
    } else {
      // settle: rings glide to their resting spots, logo eases back
      const target = Math.ceil(phase - 1e-3);
      const ease = Math.min(1, dt * (state === "found" ? 3.2 : 4.5));
      if (Math.abs(target - phase) > 1e-3) { phase += (target - phase) * ease; dirty = true; } else phase = target;
      const breathe = state === "idle" ? 1 + 0.025 * Math.sin(now / 1000 * 2.2) : 1;
      if (Math.abs(scale - breathe) > 1e-4) { scale += (breathe - scale) * Math.min(1, dt * 8); dirty = true; }
      if (glow > 1e-3) { glow *= Math.max(0, 1 - dt * 5); dirty = true; } else glow = 0;
    }
    if (shocks.length) dirty = true;
    if (phase > 1000) phase -= 1000;

    if (dirty) { draw(dt); dirty = false; }
    logo.style.transform = `scale(${scale.toFixed(4)})`;
    requestAnimationFrame(frame);
  }

  function draw(dt) {
    const u = U * dpr, cx = CX * dpr, cy = CY * dpr;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const maxR = Math.hypot(Math.max(cx, canvas.width - cx), Math.max(cy, canvas.height - cy)) + GAP * u;

    // soft glow behind the logo on each beat
    if (glow > 0.01) {
      const g = ctx.createRadialGradient(cx, cy, LOGO_R * u * 0.8, cx, cy, 260 * u);
      g.addColorStop(0, `rgba(255,140,120,${0.42 * Math.min(1, glow)})`);
      g.addColorStop(1, "rgba(255,140,120,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // concentric rings; at rest (integer phase) they sit exactly where the Figma frame has them
    const frac = phase - Math.floor(phase);
    ctx.lineWidth = LINE * u;
    for (let k = -2; ; k++) {
      const r = (R0 + GAP * (k + frac)) * u;
      if (r > maxR) break;
      // new rings fade in between R0 - GAP and R0, so at rest nothing shows inside the first ring
      const a = Math.min(1, (r / u - (R0 - GAP)) / GAP);
      if (a <= 0) continue;
      ctx.strokeStyle = `rgba(134,26,33,${a})`;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    }

    // shockwave rings released by each heartbeat
    shocks = shocks.filter(s => (s.age += dt) < 1.9);
    for (const s of shocks) {
      const p = s.age / 1.9;
      const r = (LOGO_R + 10 + 720 * (1 - Math.pow(1 - p, 2.4))) * u;
      ctx.lineWidth = (12 - 9 * p) * u;
      ctx.strokeStyle = `rgba(255,236,232,${0.55 * (1 - p) * (1 - p)})`;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    }

    // fade everything out from the centre line to the far edge of the screen
    const [x0, y0, x1, y1] = FADE.map(v => v * dpr);
    const fade = ctx.createLinearGradient(x0, y0, x1, y1);
    fade.addColorStop(0, "rgba(0,0,0,0)");
    fade.addColorStop(1, "rgba(0,0,0,1)");
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = fade;
    ctx.fillRect(x0, y0, canvas.width - x0, canvas.height - y0);
    ctx.globalCompositeOperation = "source-over";
  }

  addEventListener("resize", fit);
  document.fonts?.ready.then(() => placeLyric(false));
  fit();
  requestAnimationFrame(frame);
})();
</script>
<script>
  // Needed for a real install on Android (see sw.js).
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
